// ── Time helpers ──────────────────────────────────────────────────────────────
function getEventDate(item){
  var parts=item.time24.split(":"); var h=+parts[0],m=+parts[1];
  var d=new Date(); d.setFullYear(2026,4,8); d.setHours(h,m,0,0); return d;
}
function msUntil(item){ return getEventDate(item)-Date.now(); }
function getStatus(item){
  var ms=msUntil(item);
  if(ms<-50*60*1000)return"past";
  if(ms<0)return"active";
  if(ms<25*60*1000)return"soon";
  return"future";
}
function pad(n){ return String(n).padStart(2,"0"); }
function formatCD(ms){
  if(ms<=0)return"Now";
  var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(h>0)return h+"h "+pad(m)+"m";
  if(m>0)return m+"m "+pad(sec)+"s";
  return sec+"s";
}
function formatHMS(ms){
  if(ms<=0)return"00:00:00";
  var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  return pad(h)+":"+pad(m)+":"+pad(sec);
}

// ── State ─────────────────────────────────────────────────────────────────────
var state={
  now: Date.now(),
  expanded: null,
  notifPerm: (typeof Notification!=="undefined")?Notification.permission:"unsupported",
  webActive: false,
  webCount: 0,
  testSent: false,
  lastBannerItem: null,
};
var webTimers=[];

// ── Haptics ───────────────────────────────────────────────────────────────────
function vibrate(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}

// ── Render helpers ────────────────────────────────────────────────────────────
function currentItem(){
  var active=ITEMS.find(function(i){ var ms=msUntil(i); return ms>=-50*60*1000&&ms<0; });
  return active||ITEMS.find(function(i){ return msUntil(i)>0; });
}
function nextItem(afterItem){
  var idx=ITEMS.indexOf(afterItem);
  return ITEMS.slice(idx+1).find(function(i){ return getStatus(i)!=="past"; });
}

// Rope drop is 8:00 AM — phase switches then
function isRopeDrop(){
  var rd=new Date(); rd.setFullYear(2026,4,8); rd.setHours(8,0,0,0);
  return Date.now()>=rd.getTime();
}

// ── Notification scheduling ───────────────────────────────────────────────────
function scheduleWeb(){
  webTimers.forEach(function(id){ clearTimeout(id); }); webTimers=[];
  var n=0;
  ITEMS.forEach(function(item){
    var delay=(getEventDate(item).getTime()-item.notifyBefore*60*1000)-Date.now();
    if(delay>0){
      var id=setTimeout(function(){
        if(Notification.permission==="granted"){
          var opts={body:item.alertBody,tag:item.id,requireInteraction:!!item.action};
          try{ new Notification(item.alertTitle,opts); }catch(e){}
          vibrate(item.urgency==="critical"?[200,100,200,100,200]:[100,50,100]);
        }
      },delay);
      webTimers.push(id); n++;
    }
  });
  state.webCount=n; state.webActive=n>0;
}
async function activateWeb(){
  if(state.notifPerm!=="granted"){
    var r=await Notification.requestPermission();
    state.notifPerm=r;
  }
  if(state.notifPerm==="granted"){
    scheduleWeb();
    if(state.webCount===0) alert("All event times have already passed today.");
  }
  render();
}
async function testNotif(){
  if(state.notifPerm!=="granted"){
    var r=await Notification.requestPermission();
    state.notifPerm=r;
  }
  if(state.notifPerm==="granted"){
    new Notification("🎢 Test — Disneyland Itinerary",{body:"Notifications working! Add to Home Screen for background alerts."});
    state.testSent=true; render();
    setTimeout(function(){ state.testSent=false; render(); },3000);
  }
}
function cancelWeb(){
  webTimers.forEach(function(id){ clearTimeout(id); }); webTimers=[];
  state.webActive=false; state.webCount=0; render();
}

// ── Render ────────────────────────────────────────────────────────────────────
var PX_PROPS=new Set(["fontSize","width","height","minWidth","maxWidth","minHeight",
  "marginTop","marginBottom","marginLeft","marginRight","gap","rowGap","columnGap",
  "borderRadius","borderTopLeftRadius","borderTopRightRadius","borderBottomLeftRadius",
  "borderBottomRightRadius","top","left","right","bottom","outlineWidth",
  "paddingTop","paddingBottom","paddingLeft","paddingRight"]);

function applyStyle(el,styleObj){
  Object.keys(styleObj).forEach(function(prop){
    var val=styleObj[prop];
    if(typeof val==="number"&&PX_PROPS.has(prop)) el.style[prop]=val+"px";
    else el.style[prop]=val;
  });
}

function el(tag,attrs,children){
  var e=document.createElement(tag);
  if(attrs) Object.keys(attrs).forEach(function(k){
    if(k==="style"&&typeof attrs[k]==="object") applyStyle(e,attrs[k]);
    else if(k.startsWith("on")&&typeof attrs[k]==="function") e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    else if(k==="innerHTML") e.innerHTML=attrs[k];
    else if(k==="className") e.className=attrs[k];
    else e.setAttribute(k,attrs[k]);
  });
  if(children) [].concat(children).forEach(function(c){
    if(c==null||c===false)return;
    e.appendChild(typeof c==="string"?document.createTextNode(c):c);
  });
  return e;
}
function div(style,children){ return el("div",{style:style},children); }
function txt(tag,style,text){ var e=el(tag,{style:style}); e.textContent=text; return e; }
function btn(style,text,onclick){ return el("button",{style:style,onClick:onclick},text); }

function renderHeader(){
  var cur=currentItem();
  var next=cur?nextItem(cur):null;
  var hdrstyle={background:"linear-gradient(155deg,#1e1b4b 0%,#312E81 45%,#4338ca 100%)",padding:"env(safe-area-inset-top,20px) 18px 16px",position:"sticky",top:0,zIndex:50,boxShadow:"0 4px 20px rgba(49,46,129,.5)"};

  // Phase 1 — before rope drop
  if(!isRopeDrop()){
    var ropeDropDate=new Date(); ropeDropDate.setFullYear(2026,4,8); ropeDropDate.setHours(8,0,0,0);
    var msToRD=ropeDropDate-Date.now();
    var nextUp=ITEMS.find(function(i){ return msUntil(i)>0; });

    return div(hdrstyle,[
      div({color:"rgba(255,255,255,.5)",fontSize:11,fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",marginBottom:2},"Disneyland Resort"),
      div({color:"#fff",fontSize:22,fontWeight:800,letterSpacing:"-.5px",marginBottom:2},"May 8, 2026 🎢"),
      div({color:"rgba(255,255,255,.55)",fontSize:12,marginBottom:14},"Adults · Park Hopper · 8 MPs · 25 events"),
      div({background:"rgba(255,255,255,.1)",backdropFilter:"blur(12px)",borderRadius:16,padding:"14px 16px",border:"1px solid rgba(255,255,255,.15)"},[
        div({color:"rgba(255,255,255,.45)",fontSize:11,fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:6},"Until rope drop"),
        div({color:"#fff",fontSize:44,fontWeight:800,lineHeight:1,fontVariantNumeric:"tabular-nums",letterSpacing:"-1px",marginBottom:6}, formatHMS(msToRD)),
        div({color:"rgba(255,255,255,.5)",fontSize:12}, nextUp?("Next: "+nextUp.title+" · "+nextUp.label):""),
      ]),
    ]);
  }

  // Phase 2 — action-aware
  if(!cur) return div(hdrstyle,[
    div({color:"rgba(255,255,255,.5)",fontSize:11,fontWeight:700,letterSpacing:".09em",textTransform:"uppercase",marginBottom:4},"Disneyland Resort · May 8, 2026"),
    div({color:"#fff",fontSize:18,fontWeight:800},"🌙 All done — what a day!"),
  ]);

  var pc=PARK[cur.park]||PARK.dl;
  var urg=cur.urgency?URGENCY[cur.urgency]:null;
  var msToNext=next?msUntil(next):0;

  // Trigger haptic if banner just appeared
  if(urg&&state.lastBannerItem!==cur.id){
    state.lastBannerItem=cur.id;
    vibrate(cur.urgency==="critical"?[150,80,150]:cur.urgency==="high"?[100,50,100]:[60]);
  }

  var children=[
    // Top: park + event name
    div({marginBottom:10},[
      div({color:"rgba(255,255,255,.45)",fontSize:11,fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:2},"NOW · "+pc.name.toUpperCase()),
      div({color:"#fff",fontSize:20,fontWeight:800,letterSpacing:"-.4px",lineHeight:1.15},cur.title),
    ]),
  ];

  // Action banner (if any)
  if(urg&&cur.action){
    var bannerEl=div({background:urg.bg,borderRadius:12,padding:"10px 12px",marginBottom:10,border:"1px solid "+urg.border,boxShadow:"0 2px 12px rgba(0,0,0,.25)"},[
      div({color:urg.text,fontSize:11,fontWeight:800,letterSpacing:".1em",textTransform:"uppercase",marginBottom:4,opacity:.8},urg.label),
      div({color:"#fff",fontSize:13,fontWeight:700,lineHeight:1.4},cur.action),
    ]);
    bannerEl.className="action-banner";
    children.push(bannerEl);
  }

  // Next up + countdown
  var nextEl=div({background:"rgba(255,255,255,.1)",backdropFilter:"blur(10px)",borderRadius:12,padding:"10px 12px",border:"1px solid rgba(255,255,255,.12)",display:"flex",justifyContent:"space-between",alignItems:"center"},[
    div({flex:1,minWidth:0},[
      div({color:"rgba(255,255,255,.45)",fontSize:11,fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",marginBottom:3},"NEXT UP"),
      div({color:"rgba(255,255,255,.9)",fontSize:13,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"},next?next.title:"End of day"),
      div({color:"rgba(255,255,255,.5)",fontSize:11},next?next.label:""),
    ]),
    div({textAlign:"right",paddingLeft:12,flexShrink:0},[
      div({color:"#fff",fontSize:32,fontWeight:800,lineHeight:1,fontVariantNumeric:"tabular-nums",letterSpacing:"-1px"},next?formatCD(msToNext):""),
      div({color:"rgba(255,255,255,.4)",fontSize:11},next?"away":""),
    ]),
  ]);
  children.push(nextEl);

  return div(hdrstyle,children);
}

        ]),
        div({display:"flex",alignItems:"center",gap:8},[
          div({width:20,height:20,borderRadius:"50%",background:"rgba(255,255,255,.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#fff",flexShrink:0,fontWeight:700},"3"),
          div({color:"rgba(255,255,255,.85)",fontSize:12},'Tap "Add to Home Screen" \u2192 Add'),
        ]),
        div({display:"flex",alignItems:"center",gap:8},[
          div({width:20,height:20,borderRadius:"50%",background:"rgba(255,255,255,.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,color:"#fff",flexShrink:0,fontWeight:700},"4"),
          div({color:"rgba(255,255,255,.85)",fontSize:12},"Open from Home Screen, then activate alerts below"),
        ]),
      ]),
    ]),
  ]);

  // Web notifications card
  var webInner;
  if(state.notifPerm==="unsupported"){
    webInner=div({fontSize:13,color:"#6B7280",lineHeight:1.5},"Open this page in Safari and add to Home Screen to enable notifications.");
  } else if(!state.webActive){
    var isGranted=state.notifPerm==="granted";
    webInner=div({display:"flex",gap:8},[
      btn({flex:1,background:"#4338CA",color:"#fff",border:"none",borderRadius:12,padding:"13px",fontSize:15,fontWeight:700,cursor:"pointer",letterSpacing:"-.2px"},isGranted?"Activate Alerts":"Enable & Activate",function(){ activateWeb(); }),
      btn({background:"#F3F4F6",color:"#374151",border:"none",borderRadius:10,padding:"13px 16px",fontSize:13,cursor:"pointer",minWidth:66},state.testSent?"✓ Sent":"Test",function(){ testNotif(); }),
    ]);
  } else {
    webInner=div({display:"flex",alignItems:"center",justifyContent:"space-between"},[
      div({display:"flex",alignItems:"center",gap:10},[
        div({width:10,height:10,borderRadius:"50%",background:"#10B981",boxShadow:"0 0 0 3px #D1FAE5",flexShrink:0}),
        div({},[
          div({fontSize:14,fontWeight:700,color:"#065F46"},"Active — "+state.webCount+" alerts scheduled"),
          div({fontSize:12,color:"#9CA3AF"},"Firing all day — keep app in background"),
        ]),
      ]),
      btn({background:"none",border:"1px solid #E5E7EB",borderRadius:8,padding:"6px 12px",color:"#6B7280",fontSize:12,cursor:"pointer"},"Cancel",cancelWeb),
    ]);
  }

  var webCard=div({background:"#fff",borderRadius:18,overflow:"hidden",boxShadow:"0 2px 12px rgba(0,0,0,.07)",marginBottom:10},[
    div({background:"#1F2937",padding:"14px 16px 12px"},[
      div({display:"flex",alignItems:"center",gap:10},[
        div({width:36,height:36,borderRadius:10,background:"rgba(255,255,255,.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,flexShrink:0},"🔔"),
        div({flex:1},[
          div({color:"#fff",fontSize:15,fontWeight:700},"Activate Alerts"),
          div({color:"rgba(255,255,255,.55)",fontSize:12},"All 25 events — fires before each action"),
        ]),
        div({background:"rgba(255,255,255,.1)",borderRadius:20,padding:"3px 10px",fontSize:11,fontWeight:700,color:"rgba(255,255,255,.7)",flexShrink:0},"STEP 2"),
      ]),
    ]),
    div({padding:"12px 16px"},webInner),
  ]);

  // Once activated — collapse both sections into a single confirmation line
  if(state.webActive){
    return div({background:"#fff",borderRadius:16,padding:"12px 16px",
      boxShadow:"0 1px 4px rgba(0,0,0,.06)",marginBottom:10,
      display:"flex",alignItems:"center",justifyContent:"space-between"},[
      div({display:"flex",alignItems:"center",gap:10},[
        div({width:10,height:10,borderRadius:"50%",background:"#10B981",
          boxShadow:"0 0 0 3px #D1FAE5",flexShrink:0}),
        div({},[
          div({fontSize:14,fontWeight:700,color:"#065F46"},"Alerts active — "+state.webCount+" scheduled"),
          div({fontSize:12,color:"#9CA3AF"},"Firing all day · keep app open in background"),
        ]),
      ]),
      btn({background:"none",border:"1px solid #E5E7EB",borderRadius:8,
        padding:"6px 12px",color:"#9CA3AF",fontSize:12,cursor:"pointer"},"Cancel",cancelWeb),
    ]);
  }

  return div({},[homeBanner, webCard]);
}

function renderMPChain(){
  var chips=ITEMS.filter(function(i){ return i.mp; }).map(function(item){
    var st=getStatus(item),done=st==="past",act=st==="active"||st==="soon";
    return div({
      padding:"5px 10px",borderRadius:20,fontSize:12,fontWeight:700,flexShrink:0,
      background:done?"#D1FAE5":act?"#4338CA":"#F3F4F6",
      color:done?"#065F46":act?"#fff":"#9CA3AF",
      border:done?"1px solid #6EE7B7":act?"none":"1px solid #E5E7EB",
      transition:"all .3s",
    },done?("✓ "+item.mp):item.mp);
  });
  return div({background:"#fff",borderRadius:16,padding:"12px 14px",boxShadow:"0 1px 4px rgba(0,0,0,.06)",marginBottom:12},[
    div({fontSize:11,fontWeight:800,letterSpacing:".08em",textTransform:"uppercase",color:"#9CA3AF",marginBottom:9},"Lightning Lane Chain — 8 MPs"),
    div({display:"flex",gap:6,flexWrap:"wrap"},chips),
  ]);
}

function renderTimeline(){
  return div({},ITEMS.map(function(item,idx){
    var status=getStatus(item);
    var pc=PARK[item.park]||PARK.dl;
    var pass=item.pass?(PASSC[item.pass]||{bg:"#F3F4F6",text:"#374151",label:item.pass}):null;
    var isExp=state.expanded===item.id;
    var isLate=item.park==="late";
    var isPast=status==="past";
    var isAct=status==="active"||status==="soon";
    var urg=item.urgency?URGENCY[item.urgency]:null;

    // Main card
    var card=div({
      background:isLate?"#1C2333":"#fff",
      borderRadius:14,overflow:"hidden",
      border:isAct?("2px solid "+pc.dot):"2px solid transparent",
      boxShadow:isAct?("0 0 0 4px "+(isLate?"rgba(107,114,128,.15)":pc.bg)+",0 4px 16px rgba(0,0,0,.1)"):"0 1px 3px rgba(0,0,0,.07)",
      cursor:"pointer",transition:"all .2s",
      WebkitUserSelect:"none",userSelect:"none",
    });
    card.addEventListener("click",function(){
      state.expanded=(isExp?null:item.id); render();
    });

    // Row content
    var timeEl=div({minWidth:66,paddingTop:1},[
      div({fontSize:12,fontWeight:700,color:isLate?"#9CA3AF":"#374151",fontVariantNumeric:"tabular-nums"},item.label),
      item.mp?div({fontSize:11,fontWeight:700,color:"#10B981",marginTop:2},item.mp):null,
    ]);

    var dotEl=div({display:"flex",flexDirection:"column",alignItems:"center",paddingTop:5,flexShrink:0},[
      div({
        width:isAct?12:8,height:isAct?12:8,borderRadius:"50%",
        background:isPast?"#D1D5DB":pc.dot,
        boxShadow:isAct?("0 0 0 3px "+pc.bg):"none",
        transition:"all .3s",
        className:isAct?"now-dot":"",
      }),
      idx<ITEMS.length-1?div({width:1.5,height:22,background:isLate?"#374151":"#E5E7EB",marginTop:3}):null,
    ]);

    var badges=div({display:"flex",gap:5,flexWrap:"wrap",marginTop:6},[
      div({fontSize:11,fontWeight:600,padding:"3px 8px",borderRadius:20,background:isLate?"rgba(255,255,255,.08)":pc.bg,color:isLate?"#9CA3AF":pc.text,minHeight:22},pc.name),
      pass?div({fontSize:11,fontWeight:600,padding:"3px 8px",borderRadius:20,background:pass.bg,color:pass.text,minHeight:22},pass.label):null,
      isAct?div({fontSize:11,fontWeight:700,padding:"3px 8px",borderRadius:20,background:pc.dot,color:"#fff",animation:"pulse 1.8s infinite",minHeight:22},"NOW"):null,
    ]);

    var content=div({flex:1,minWidth:0},[
      div({fontSize:15,fontWeight:700,color:isLate?"#F9FAFB":"#111827",lineHeight:1.2,marginBottom:3},item.title),
      div({fontSize:12,color:isLate?"#6B7280":"#6B7280"},item.subtitle),
      badges,
    ]);

    var chevron=div({color:isLate?"#4B5563":"#D1D5DB",fontSize:11,paddingTop:4,flexShrink:0},isExp?"▲":"▼");

    var row=div({display:"flex",alignItems:"flex-start",padding:"13px 14px",gap:10,minHeight:72},[timeEl,dotEl,content,chevron]);
    card.appendChild(row);

    // Expanded detail
    if(isExp){
      var detail=div({
        borderTop:isLate?"1px solid #374151":"1px solid #F3F4F6",
        padding:"12px 14px 14px 90px",
        background:isLate?"#161D2F":"#FAFAFA",
      });
      var detailTxt=document.createElement("p");
      detailTxt.textContent=item.details;
      detailTxt.style.cssText="font-size:13px;color:"+(isLate?"#9CA3AF":"#4B5563")+";line-height:1.6;margin:0 0 10px";
      detail.appendChild(detailTxt);

      if(item.action&&urg){
        var actBox=div({background:isLate?"#1C2333":urg.bg,borderRadius:10,padding:"10px 12px",borderLeft:"3px solid "+urg.border,marginBottom:8},[
          div({fontSize:11,fontWeight:800,color:urg.border,letterSpacing:".07em",textTransform:"uppercase",marginBottom:3},urg.label),
          div({fontSize:13,fontWeight:700,color:isLate?"#F9FAFB":"#fff",lineHeight:1.4},item.action),
        ]);
        detail.appendChild(actBox);
      }

      var alertNote=div({fontSize:11,color:isLate?"#4B5563":"#9CA3AF",display:"flex",alignItems:"center",gap:6},[
        txt("span",{},"🔔"),
        txt("span",{},"Alert fires "+(item.notifyBefore>0?(item.notifyBefore+" min before"):"at event time")),
      ]);
      detail.appendChild(alertNote);
      card.appendChild(detail);
    }

    return div({marginBottom:7,opacity:isPast?.4:1,transition:"opacity .3s"},card);
  }));
}

function render(){
  var app=document.getElementById("app");
  app.innerHTML="";

  // Outer wrapper
  var wrap=div({maxWidth:430,margin:"0 auto",minHeight:"100vh",background:"#F2F2F7",paddingBottom:"env(safe-area-inset-bottom,20px)"});

  // Header
  wrap.appendChild(renderHeader());

  // Scroll content
  var scroll=div({padding:"12px 16px 120px"});
  scroll.appendChild(renderNotifCard());
  scroll.appendChild(renderMPChain());

  // Section label
  var secLabel=div({fontSize:11,fontWeight:800,letterSpacing:".08em",textTransform:"uppercase",color:"#9CA3AF",marginBottom:10,paddingLeft:2},"Full Itinerary — tap any row to expand");
  scroll.appendChild(secLabel);

  scroll.appendChild(renderTimeline());

  // Footer
  var footer=div({textAlign:"center",paddingTop:12},[
    div({fontSize:11,color:"#9CA3AF",lineHeight:1.8},"Verified · 35% forecast crowd · Fantasmic confirmed May 8"),
    div({fontSize:11,color:"#BBBBBB"},"All closures checked May 2, 2026"),
  ]);
  scroll.appendChild(footer);
  wrap.appendChild(scroll);
  app.appendChild(wrap);
}

// ── Tick ──────────────────────────────────────────────────────────────────────
var lastPhase=isRopeDrop();
var lastActiveId=null;



// Since patching isn't reliable across full re-renders, just re-render every second
// but do it efficiently by only updating the parts that change
setInterval(function(){
  state.now=Date.now();
  var curPhase=isRopeDrop();
  var cur=currentItem();
  var curId=cur?cur.id:null;
  if(curPhase!==lastPhase||curId!==lastActiveId){
    lastPhase=curPhase; lastActiveId=curId;
  }
  render();
},1000);

// Initial render
render();
</script>
</body>
</html>
